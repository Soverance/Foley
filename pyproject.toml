[project]
name = "foley"
version = "0.1.0"
description = "Index a sound library so Claude Code can search, inspect and pick audio it cannot hear"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Soverance Studios" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soxr>=0.3",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyloudnorm>=0.1.1",
    "xxhash>=3.4",
    "mutagen>=1.47",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "mcp>=2.3",
]

[project.scripts]
foley = "foley.cli:main"
foley-mcp = "foley.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foley"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "nas: needs the real library share (deselect with -m 'not nas')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Fixture library paths mirror real pack names and are long by nature.
"tests/conftest.py" = ["E501"]
