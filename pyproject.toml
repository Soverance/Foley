[project]
name = "foley"
version = "0.1.0"
description = "Index a sound library so Claude Code can search, inspect and pick audio it cannot hear"
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/foley/browse_ui/fonts/*-OFL.txt",
]
requires-python = ">=3.12"
authors = [{ name = "Soverance Studios" }]
keywords = [
    "audio",
    "sound effects",
    "game development",
    "mcp",
    "claude",
    "clap",
    "audioset",
    "sqlite",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soxr>=0.3",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyloudnorm>=0.1.1",
    "xxhash>=3.4",
    "mutagen>=1.47",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "mcp>=2.3",
]

[project.optional-dependencies]
# The model stages (PANNs CNN14 tags, CLAP embeddings) and semantic search:
# `uv sync --extra models`. Without them `foley index` skips those stages and search is
# keyword-only. torch comes from the CUDA wheel index on Windows and Linux (see
# [tool.uv.sources]) and from PyPI on macOS.
models = [
    "torch>=2.6",
    "transformers>=4.45",
]

[project.urls]
Repository = "https://github.com/soverance/foley"
Issues = "https://github.com/soverance/foley/issues"

[project.scripts]
foley = "foley.cli:main"
foley-mcp = "foley.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

# CUDA 12.6 wheels: built for sm_50 through sm_90, so they run on Turing (sm_75, e.g. an
# RTX 2070) as well as newer cards, and need an NVIDIA driver >= 560. On a machine
# without a CUDA GPU these wheels still run on the CPU. macOS gets PyPI's CPU/MPS wheels.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
# torch publishes no wheels for Intel macOS any more; resolve for the platforms it does.
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foley"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "nas: needs the real library share (deselect with -m 'not nas')",
    "models: needs real model weights (downloads on first use; run with -m models)",
]
addopts = "-m 'not models'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Fixture library paths mirror real pack names and are long by nature.
"tests/conftest.py" = ["E501"]
